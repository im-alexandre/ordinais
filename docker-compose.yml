services:
  db_electre:
    image: postgres:12.0-alpine
    volumes:
      - postgres_data_electre_mor:/var/lib/postgresql/data/
    env_file:
      - ./electre_mor/env.electre

  electre_mor:
    build:
      context: ./electre_mor
    entrypoint: './entrypoint_electre.sh'
    volumes:
      - ./electre_mor:/usr/src/app
    expose:
      - 80
    env_file:
      - ./electre_mor/env.electre
    depends_on:
      - db_electre
    labels:
      - traefik.enable=true
      - traefik.http.routers.electremor.rule=Host(`electremor.drg.ink`)
      - traefik.http.routers.electremor.entrypoints=web,websecure
      - traefik.http.routers.electremor.tls=true
      - traefik.http.services.electremor.loadbalancer.server.port=80

volumes:
  postgres_data_electre_mor:
