<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Calm Stone</title>
    <style>
      :root {
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        --bg: #f6f4ef;
        --surface: #ffffff;
        --surface-soft: #ece8df;
        --border: #d7d0c4;
        --text: #24302d;
        --muted: #66736d;
        --primary: #4f6f64;
        --primary-hover: #3f5b52;
        --accent: #b58b5b;
        --danger-soft: #9b5d50;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background: var(--bg);
        color: var(--text);
        display: grid;
        place-items: center;
        padding: 40px;
      }

      main {
        width: min(980px, 100%);
        display: grid;
        gap: 24px;
      }

      header {
        display: flex;
        align-items: end;
        justify-content: space-between;
        gap: 24px;
      }

      h1,
      h2,
      p {
        margin: 0;
      }

      h1 {
        font-size: 34px;
        letter-spacing: 0;
      }

      p {
        color: var(--muted);
        line-height: 1.6;
      }

      .swatches {
        display: grid;
        grid-template-columns: repeat(10, minmax(0, 1fr));
        overflow: hidden;
        border: 1px solid var(--border);
        border-radius: 16px;
        background: var(--surface);
      }

      .swatch {
        min-height: 92px;
      }

      .mock {
        display: grid;
        grid-template-columns: 0.9fr 1.1fr;
        gap: 18px;
      }

      .card {
        border: 1px solid var(--border);
        border-radius: 14px;
        background: var(--surface);
        padding: 22px;
        box-shadow: 0 18px 50px rgba(36, 48, 45, 0.08);
      }

      .table {
        display: grid;
        gap: 10px;
        margin-top: 18px;
      }

      .row {
        display: grid;
        grid-template-columns: 1fr 72px 72px 72px;
        gap: 10px;
        align-items: center;
      }

      .row.header {
        color: var(--muted);
        font-size: 12px;
        font-weight: 800;
        text-transform: uppercase;
      }

      input {
        width: 100%;
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 10px 12px;
        color: var(--text);
        background: var(--surface);
      }

      .slider-row {
        display: grid;
        grid-template-columns: 100px 1fr 100px;
        gap: 14px;
        align-items: center;
        margin-top: 18px;
        font-weight: 800;
      }

      input[type="range"] {
        accent-color: var(--primary);
      }

      button {
        border: 0;
        border-radius: 999px;
        padding: 13px 20px;
        color: white;
        background: var(--primary);
        font-weight: 800;
      }

      .accent {
        color: var(--accent);
        font-weight: 900;
      }

      @media (max-width: 760px) {
        .mock,
        header {
          grid-template-columns: 1fr;
          display: grid;
        }

        .swatches {
          grid-template-columns: repeat(5, minmax(0, 1fr));
        }
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <div>
          <h1>Calm Stone</h1>
          <p>Paleta clara, sóbria, sem neon, com verde sálvia e bronze fosco.</p>
        </div>
        <button>Salvar avaliação</button>
      </header>

      <section class="swatches" aria-label="Amostras da paleta Calm Stone">
        <div class="swatch" style="background: #f6f4ef"></div>
        <div class="swatch" style="background: #ffffff"></div>
        <div class="swatch" style="background: #ece8df"></div>
        <div class="swatch" style="background: #d7d0c4"></div>
        <div class="swatch" style="background: #24302d"></div>
        <div class="swatch" style="background: #66736d"></div>
        <div class="swatch" style="background: #4f6f64"></div>
        <div class="swatch" style="background: #3f5b52"></div>
        <div class="swatch" style="background: #b58b5b"></div>
        <div class="swatch" style="background: #9b5d50"></div>
      </section>

      <section class="mock">
        <div class="card">
          <h2>Parâmetros q, p e v</h2>
          <p>Valores em tabela compacta.</p>
          <div class="table">
            <div class="row header">
              <span>Critério</span><span>q</span><span>p</span><span>v</span>
            </div>
            <div class="row">
              <strong>Qualidade</strong><input value="0,1" /><input value="0,2" /><input value="0,8" />
            </div>
            <div class="row">
              <strong>Custo</strong><input value="0,1" /><input value="0,2" /><input value="0,8" />
            </div>
          </div>
        </div>

        <div class="card">
          <h2>Avaliações dos Critérios</h2>
          <p>Sliders discretos com destaque <span class="accent">bronze</span>.</p>
          <div class="slider-row">
            <span>Qualidade</span><input type="range" value="35" /><span>Custo</span>
          </div>
          <div class="slider-row">
            <span>Qualidade</span><input type="range" value="22" /><span>Eficácia</span>
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
